<!doctype html>
<html lang="en-us">
<head>
    <link rel="icon" type="image/x-icon" href="@HELLO_IMGUI_FAVICON@">

    <!--

    See https://developer.apple.com/library/archive/documentation/AppleApplications/Reference/SafariWebContent/ConfiguringWebApplications/ConfiguringWebApplications.html

    <link rel="apple-touch-icon" href="@HELLO_IMGUI_FAVICON@">
    <meta name="apple-mobile-web-app-title" content="@HELLO_IMGUI_ICON_DISPLAY_NAME@">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    -->

    <!--
    You could include your own custom CSS and JS here, e.g.:
    <script src="custom.js"></script>

    Any file located in assets/app_settings/emscripten/ will be copied to the build directory.
    -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"/>
    <title>@HELLO_IMGUI_ICON_DISPLAY_NAME@</title>
    <style>
        body { margin: 0; background-color: black }
        .emscripten {
            position: absolute;
            top: 0px;
            left: 0px;
            margin: 0px;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: block;
            image-rendering: optimizeSpeed;
            image-rendering: crisp-edges;
            -ms-interpolation-mode: nearest-neighbor;
        }
    </style>
</head>
<body>
<canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
<script type='text/javascript'>
    var Module = {
        preRun: [],
        postRun: [],
        print: (function() {
            return function(text) {
                text = Array.prototype.slice.call(arguments).join(' ');
                console.log(text);
            };
        })(),
        printErr: function(text) {
            text = Array.prototype.slice.call(arguments).join(' ');
            console.error(text);
        },
        canvas: (function() {
            var canvas = document.getElementById('canvas');
            canvas.addEventListener("webglcontextlost", function(e) {
                alert('WebGL context lost, please reload the page');
                e.preventDefault();
            }, false);

            // Explicitly create a WebGL 2 context with stencil buffer enabled.
            if (typeof WebGL2RenderingContext !== 'undefined') {
                var gl = canvas.getContext('webgl2', { stencil: true });
                if (!gl) {
                    console.error('WebGL 2 not available, falling back to WebGL');
                    gl = canvas.getContext('webgl', { stencil: true });
                }
                if (!gl) {
                    alert('WebGL not available with stencil buffer');
                }
                return canvas;
            } else {
                alert('WebGL 2 not supported by this browser');
            }
        })(),
        setStatus: function(text) {
            console.log("status: " + text);
        },
        monitorRunDependencies: function(left) {
            // no run dependencies to log
        }
    };
    window.onerror = function() {
        console.log("onerror: " + event);
    };
</script>
<script type='text/javascript'>
    (function() {
        Module.scpp_loadButtonHovered = false;

        var fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.accept = '.png,.jpg,.jpeg';
        fileInput.style.display = 'none';
        document.body.appendChild(fileInput);

        fileInput.addEventListener('change', function(e) {
            var file = e.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function() {
                var data = new Uint8Array(reader.result);
                var nameLen = lengthBytesUTF8(file.name) + 1;
                var namePtr = _malloc(nameLen);
                stringToUTF8(file.name, namePtr, nameLen);
                var dataPtr = _malloc(data.length);
                HEAPU8.set(data, dataPtr);
                _scpp_onImageFileUploaded(namePtr, dataPtr,
                                          data.length);
                _free(namePtr);
                _free(dataPtr);
            };
            reader.readAsArrayBuffer(file);
            fileInput.value = '';
        });

        var canvas = document.getElementById('canvas');
        canvas.addEventListener('pointerdown', function() {
            if (!Module.scpp_loadButtonHovered) return;
            Module.scpp_loadButtonHovered = false;
            _scpp_activateLoadBrowser();
            fileInput.click();
        });
    })();
</script>
{{{ SCRIPT }}}
</body>
</html>
