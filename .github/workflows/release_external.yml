name: "Release Build"

# Manual-dispatch build that publishes the shoecomp binary as a release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    permissions:
      contents: write
    name: "Release Build"
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-15-intel, macos-latest, ubuntu-latest, ubuntu-24.04-arm]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: apt install xorg-dev  libglfw3-dev (ubuntu only)
      if: ${{ matrix.platform == 'ubuntu-latest' || matrix.platform == 'ubuntu-24.04-arm' }}
      run: sudo apt-get update && sudo apt-get install -y xorg-dev  libglfw3-dev

    - name: Build on ${{ matrix.platform }}
      run: |
        cmake -S . -B build -DHELLOIMGUI_DOWNLOAD_FREETYPE_IF_NEEDED=ON -DHELLOIMGUI_MACOS_CREATE_APP_BUNDLE=ON -DCMAKE_BUILD_TYPE=Release
        cmake --build build --config Release

    - name: Stage shoecomp binary (windows)
      if: ${{ matrix.platform == 'windows-latest' }}
      shell: pwsh
      run: |
        Copy-Item build/Release/shoecomp.exe shoecomp-${{ matrix.platform }}.exe

    - name: Stage shoecomp binary (ubuntu)
      if: ${{ matrix.platform == 'ubuntu-latest' || matrix.platform == 'ubuntu-24.04-arm' }}
      run: |
        cp build/shoecomp shoecomp-${{ matrix.platform }}

    - name: Upload shoecomp binary (windows)
      if: ${{ matrix.platform == 'windows-latest' }}
      uses: softprops/action-gh-release@v2
      with:
        prerelease: true
        files: shoecomp-${{ matrix.platform }}.exe

    - name: Upload shoecomp binary (ubuntu)
      if: ${{ matrix.platform == 'ubuntu-latest' || matrix.platform == 'ubuntu-24.04-arm' }}
      uses: softprops/action-gh-release@v2
      with:
        prerelease: true
        files: shoecomp-${{ matrix.platform }}

    - name: Stage shoecomp.app (macos)
      if: ${{ startsWith(matrix.platform, 'macos') }}
      run: |
        cd build
        ditto -c -k --sequesterRsrc --keepParent shoecomp.app ../shoecomp-${{ matrix.platform }}.zip

    - name: Upload shoecomp bundle (macos)
      if: ${{ startsWith(matrix.platform, 'macos') }}
      uses: softprops/action-gh-release@v2
      with:
        prerelease: true
        files: shoecomp-${{ matrix.platform }}.zip

  build-emscripten:
    permissions:
      contents: write
    name: "Release Build (Emscripten)"
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install emscripten
      run: ./third_party/hello_imgui/tools/emscripten/install_emscripten.sh

    - name: Build with emscripten
      run: |
        source ~/emsdk/emsdk_env.sh
        emcmake cmake -S . -B build-emscripten -DCMAKE_BUILD_TYPE=Release \
          -DHELLOIMGUI_USE_SDL2=ON \
          -DCMAKE_C_FLAGS="-pthread -sUSE_SDL=2" \
          -DCMAKE_CXX_FLAGS="-pthread -sUSE_SDL=2" \
          -DCMAKE_EXE_LINKER_FLAGS="-pthread -sFULL_ES3=1 -sUSE_SDL=2 -sPROXY_TO_PTHREAD -sPTHREAD_POOL_SIZE=2 -sUSE_WEBGL2=1 -sMIN_WEBGL_VERSION=1 -sMAX_WEBGL_VERSION=2"
        cmake --build build-emscripten

    - name: Stage emscripten build
      run: |
        mkdir -p shoecomp-emscripten
        cp build-emscripten/shoecomp.html shoecomp-emscripten/
        cp build-emscripten/shoecomp.js shoecomp-emscripten/
        cp build-emscripten/shoecomp.wasm shoecomp-emscripten/
        for f in build-emscripten/shoecomp.data build-emscripten/shoecomp.worker.js; do
          [ -f "$f" ] && cp "$f" shoecomp-emscripten/
        done
        zip -r shoecomp-emscripten.zip shoecomp-emscripten/

    - name: Upload emscripten build
      uses: softprops/action-gh-release@v2
      with:
        prerelease: true
        files: shoecomp-emscripten.zip
