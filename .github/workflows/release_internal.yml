name: "Release Internal"

# Manual-dispatch build that publishes the shoecomp binary as an artifact

on:
  workflow_dispatch:

jobs:
  build:
    name: "Internal Build"
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-latest]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: apt install xorg-dev  libglfw3-dev (ubuntu only)
      if: ${{ matrix.platform == 'ubuntu-latest' }}
      run: sudo apt-get update && sudo apt-get install -y xorg-dev  libglfw3-dev

    - name: Build on ${{ matrix.platform }}
      run: |
        cmake -S . -B build -DHELLOIMGUI_DOWNLOAD_FREETYPE_IF_NEEDED=ON -DHELLOIMGUI_MACOS_CREATE_APP_BUNDLE=ON -DCMAKE_BUILD_TYPE=Release
        cmake --build build --config Release

    - name: Stage shoecomp folder (windows)
      if: ${{ matrix.platform == 'windows-latest' }}
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path staging/shoecomp | Out-Null
        Copy-Item build/Release/shoecomp.exe staging/shoecomp/
        Copy-Item -Recurse build/assets staging/shoecomp/assets

    - name: Stage shoecomp folder (ubuntu)
      if: ${{ matrix.platform == 'ubuntu-latest' }}
      run: |
        mkdir -p staging/shoecomp
        cp build/shoecomp staging/shoecomp/
        cp -r build/assets staging/shoecomp/assets

    - name: Upload shoecomp folder (windows)
      if: ${{ matrix.platform == 'windows-latest' }}
      uses: actions/upload-artifact@v4
      with:
        name: shoecomp-${{ matrix.platform }}
        path: staging

    - name: Upload shoecomp binary (macos)
      if: ${{ matrix.platform == 'macos-latest' }}
      uses: actions/upload-artifact@v4
      with:
        name: shoecomp-macos-arm64
        path: build/shoecomp.app

    - name: Upload shoecomp folder (ubuntu)
      if: ${{ matrix.platform == 'ubuntu-latest' }}
      uses: actions/upload-artifact@v4
      with:
        name: shoecomp-${{ matrix.platform }}
        path: staging

  build-emscripten:
    name: "Internal Build (Emscripten)"
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install emscripten
      run: ./third_party/hello_imgui/tools/emscripten/install_emscripten.sh

    - name: Build with emscripten
      run: |
        source ~/emsdk/emsdk_env.sh
        emcmake cmake -S . -B build-emscripten -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_FLAGS="-pthread -sUSE_GLFW=3 -sPROXY_TO_PTHREAD -sPTHREAD_POOL_SIZE=2 -sUSE_WEBGL2=1 -sMAX_WEBGL_VERSION=2" \
          -DCMAKE_CXX_FLAGS="-pthread -sUSE_GLFW=3 -sPROXY_TO_PTHREAD -sPTHREAD_POOL_SIZE=2 -sUSE_WEBGL2=1 -sMAX_WEBGL_VERSION=2" \
          -DCMAKE_EXE_LINKER_FLAGS="-pthread -sUSE_GLFW=3 -sPROXY_TO_PTHREAD -sPTHREAD_POOL_SIZE=2 -sUSE_WEBGL2=1 -sMAX_WEBGL_VERSION=2"
        cmake --build build-emscripten

    - name: Stage emscripten build
      run: |
        mkdir -p shoecomp-emscripten
        cp build-emscripten/shoecomp.html shoecomp-emscripten/
        cp build-emscripten/shoecomp.js shoecomp-emscripten/
        cp build-emscripten/shoecomp.wasm shoecomp-emscripten/
        for f in build-emscripten/shoecomp.data build-emscripten/shoecomp.worker.js; do
          [ -f "$f" ] && cp "$f" shoecomp-emscripten/
        done
        zip -r shoecomp-emscripten.zip shoecomp-emscripten/

    - name: Upload emscripten build
      uses: actions/upload-artifact@v4
      with:
        name: shoecomp-emscripten
        path: shoecomp-emscripten
